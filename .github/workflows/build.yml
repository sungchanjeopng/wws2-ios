name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  spm:
    name: SPM Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build (macOS)
        run: swift build -v

      - name: Test (macOS)
        run: swift test -v

  ios-app:
    name: iOS App (Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List schemes
        run: xcodebuild -list -project WESSWARE.xcodeproj

      - name: Build iOS app for Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project WESSWARE.xcodeproj \
            -scheme WESSWARE \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Locate built .app
        run: |
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -20

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: WESSWARE-Simulator-app
          path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: warn

  ios-ipa:
    name: iOS Device (.ipa, unsigned for AltStore)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app for Device (unsigned)
        # AltStore re-signs with the user's free Apple ID at install time,
        # so we deliberately disable code signing here. archiveOnly=NO so
        # we get a real .app bundle instead of an .xcarchive that AltStore
        # cannot read directly.
        run: |
          set -o pipefail
          xcodebuild \
            -project WESSWARE.xcodeproj \
            -scheme WESSWARE \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            -derivedDataPath build \
            build

      - name: Locate built .app
        run: |
          find build/Build/Products -type d -name "*.app"

      - name: Package as .ipa for AltStore sideload
        # Apple's IPA format is just a zip with a top-level Payload/<App>.app
        # directory. AltStore accepts unsigned .ipa and re-signs on install.
        run: |
          set -e
          APP_PATH=$(find build/Build/Products -type d -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: no .app found"
            exit 1
          fi
          echo "Found: $APP_PATH"
          mkdir -p package/Payload
          cp -R "$APP_PATH" package/Payload/
          cd package
          zip -r ../WESSWARE.ipa Payload
          cd ..
          ls -la WESSWARE.ipa
          unzip -l WESSWARE.ipa | head -20

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: WESSWARE-Device-ipa
          path: WESSWARE.ipa
          if-no-files-found: error
