name: WESSWARE
options:
  bundleIdPrefix: com.wessglobal
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: ko
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
packages:
  WWS2iOS:
    path: .
targets:
  WESSWARE:
    type: application
    platform: iOS
    sources:
      - path: Sources/WWS2iOSApp
    info:
      path: iOSApp/Info.plist
      properties:
        CFBundleDisplayName: WESSWARE
        NSBluetoothAlwaysUsageDescription: WESSWARE 장비와 BLE로 연결하기 위해 Bluetooth 권한이 필요합니다.
        NSBluetoothPeripheralUsageDescription: WESSWARE 장비와 BLE로 연결하기 위해 Bluetooth 권한이 필요합니다.
        NSLocationWhenInUseUsageDescription: WESSWARE 장비 검색/연결 기능에 위치 권한이 필요할 수 있습니다.
        UIBackgroundModes:
          - bluetooth-central
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wessglobal.wessware
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
    dependencies:
      - package: WWS2iOS
        product: WWS2Core
      - package: WWS2iOS
        product: WWS2BLE
